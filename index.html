<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Do you love me?</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Poppins", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #ffe4f0 0%, #ffd6ea 50%, #fbe3ff 100%);
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* floating background hearts */
  .bg-heart {
    position: fixed;
    bottom: -40px;
    color: #ff7aa8;
    opacity: 0.35;
    pointer-events: none;
    animation: rise linear forwards;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }

  .card {
    position: relative;
    width: min(520px, calc(100vw - 32px));
    padding: 48px 36px 32px;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 18px 50px rgba(255, 77, 128, 0.18), 0 2px 8px rgba(0,0,0,0.06);
    text-align: center;
    z-index: 1;
  }

  /* ---------- cat ---------- */
  .cat-wrap {
    position: relative;
    width: 150px;
    height: 130px;
    margin: 0 auto 20px;
    animation: bob 2.4s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .cat-wrap svg { width: 100%; height: 100%; overflow: visible; }

  .cat-heart {
    position: absolute;
    top: -6px;
    right: 2px;
    font-size: 34px;
    animation: beat 1s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1) rotate(12deg); }
    50% { transform: scale(1.25) rotate(12deg); }
  }

  .eye { transition: all .25s; transform-origin: center; transform-box: fill-box; }
  .blink { animation: blink 4s infinite; }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  h1 {
    font-size: 1.8rem;
    font-weight: 800;
    color: #1d1d1f;
    margin-bottom: 28px;
  }

  .buttons {
    position: relative;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  button {
    font-family: inherit;
    font-weight: 800;
    border: none;
    border-radius: 999px;
    cursor: pointer;
  }

  #yes {
    background: linear-gradient(135deg, #ff4f7e, #ff2d6b);
    color: #fff;
    font-size: 1.15rem;
    padding: 13px 30px;
    box-shadow: 0 8px 20px rgba(255, 45, 107, 0.4);
    transition: transform .2s, box-shadow .2s;
    z-index: 2;
  }
  #yes:hover { transform: scale(1.06); box-shadow: 0 10px 26px rgba(255, 45, 107, 0.55); }
  #yes:active { transform: scale(0.97); }

  #no {
    background: #eee;
    color: #555;
    font-size: 1.15rem;
    padding: 14px 32px;
    transition: left .08s linear, top .08s linear;
    z-index: 3;
  }
  #no.flying { position: fixed; }

  .hint {
    margin-top: 16px;
    font-size: 1rem;
    font-weight: 600;
    color: #333;
    min-height: 1.2em;
    transition: opacity .3s;
  }

  /* ---------- success ---------- */
  .success { display: none; }
  .card.done .question { display: none; }
  .card.done .success { display: block; animation: pop .5s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .success h2 { font-size: 2rem; font-weight: 800; color: #ff2d6b; margin-bottom: 6px; }
  .success p { color: #555; font-size: .95rem; }

  /* ---------- popup ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(255, 45, 107, 0.25);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s;
    z-index: 20;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }

  .popup {
    width: min(420px, 100%);
    padding: 40px 28px 30px;
    background: #fff;
    border-radius: 22px;
    text-align: center;
    box-shadow: 0 24px 60px rgba(255, 45, 107, 0.35);
    transform: scale(.5);
    transition: transform .45s cubic-bezier(.2, 1.6, .4, 1);
  }
  .overlay.show .popup { transform: scale(1); }

  .popup .big-heart {
    font-size: 64px;
    display: inline-block;
    animation: beat 1s ease-in-out infinite;
  }
  .popup h2 {
    margin: 12px 0 8px;
    font-size: 2.2rem;
    font-weight: 800;
    color: #ff2d6b;
  }
  .popup p { color: #444; font-size: 1rem; margin-bottom: 22px; }
  .popup button {
    background: linear-gradient(135deg, #ff4f7e, #ff2d6b);
    color: #fff;
    font-size: 1rem;
    padding: 12px 28px;
    box-shadow: 0 8px 20px rgba(255, 45, 107, 0.35);
  }

  .confetti {
    position: fixed;
    top: -30px;
    pointer-events: none;
    z-index: 30;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(540deg); }
  }
</style>
</head>
<body>

<div class="card" id="card">
  <div class="cat-wrap">
    <svg viewBox="0 0 110 95" aria-hidden="true">
      <!-- ears -->
      <path d="M18 38 L24 6 L46 26 Z" fill="#f7b27a" />
      <path d="M92 38 L86 6 L64 26 Z" fill="#f7b27a" />
      <path d="M24 30 L27 14 L38 25 Z" fill="#ffd0d8" />
      <path d="M86 30 L83 14 L72 25 Z" fill="#ffd0d8" />
      <!-- head -->
      <ellipse cx="55" cy="56" rx="44" ry="36" fill="#f7b27a" />
      <!-- cheeks -->
      <ellipse cx="28" cy="66" rx="7" ry="4" fill="#ff9fb4" opacity=".6" />
      <ellipse cx="82" cy="66" rx="7" ry="4" fill="#ff9fb4" opacity=".6" />
      <!-- eyes (normal) -->
      <g id="eyesNormal">
        <ellipse class="eye blink" cx="40" cy="54" rx="4" ry="5" fill="#2b2b2b" />
        <ellipse class="eye blink" cx="70" cy="54" rx="4" ry="5" fill="#2b2b2b" />
      </g>
      <!-- eyes (happy) -->
      <g id="eyesHappy" style="display:none" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M34 56 Q40 48 46 56" />
        <path d="M64 56 Q70 48 76 56" />
      </g>
      <!-- nose + mouth -->
      <path d="M52 63 L58 63 L55 67 Z" fill="#e0607e" />
      <path id="mouth" d="M55 67 Q51 72 47 69 M55 67 Q59 72 63 69" stroke="#2b2b2b" stroke-width="1.6" fill="none" stroke-linecap="round" />
    </svg>
    <span class="cat-heart">❤️</span>
  </div>

  <div class="question">
    <h1>Do you love me? ❤️</h1>
    <div class="buttons" id="buttons">
      <button id="yes">Yes! 💖</button>
      <button id="no">No</button>
    </div>
    <p class="hint" id="hint">&nbsp;</p>
  </div>

  <div class="success">
    <h2>I knew it! 🥰</h2>
    <p>I love you too, forever and always 💕</p>
  </div>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <div class="popup">
    <span class="big-heart">💖</span>
    <h2 id="popupTitle">I love you too!</h2>
    <p>Forever and always 💕</p>
    <button id="closePopup">Aww 🥰</button>
  </div>
</div>

<script>
  const noBtn = document.getElementById("no");
  const yesBtn = document.getElementById("yes");
  const hint = document.getElementById("hint");
  const card = document.getElementById("card");

  const messages = [
    "Wrong button! 😅",
    "Nope, try again 😜",
    "Are you sure? 🥺",
    "You can't catch me! 🏃‍♂️",
    "Just press Yes 💘",
    "Think again... 😏",
    "Nice try 😂",
    "The cat is sad now 😿",
  ];
  let tries = 0;
  let wasNear = false;
  let pos = null; // {x, y} top-left of the No button once it starts moving
  const PAD = 10;

  const size = () => ({ w: noBtn.offsetWidth, h: noBtn.offsetHeight });
  // how close (from the button's center) the cursor is allowed to get
  const keepAway = () => Math.hypot(size().w, size().h) / 2 + 25;

  function clamp(x, y) {
    const { w, h } = size();
    return {
      x: Math.max(PAD, Math.min(x, window.innerWidth - w - PAD)),
      y: Math.max(PAD, Math.min(y, window.innerHeight - h - PAD)),
    };
  }

  function place(x, y) {
    if (!pos) {
      // switch from normal layout to free-floating, starting where it is now
      const r = noBtn.getBoundingClientRect();
      noBtn.style.left = r.left + "px";
      noBtn.style.top = r.top + "px";
      noBtn.classList.add("flying");
      void noBtn.offsetWidth;
    }
    pos = clamp(x, y);
    noBtn.style.left = pos.x + "px";
    noBtn.style.top = pos.y + "px";
  }

  function nextMessage() {
    hint.textContent = messages[tries % messages.length];
    tries++;
  }

  // push the button so it stays just out of the cursor's reach
  function repel(mx, my) {
    const { w, h } = size();
    const r = noBtn.getBoundingClientRect();
    const cur = pos || { x: r.left, y: r.top };
    const cx = cur.x + w / 2, cy = cur.y + h / 2;
    let dx = cx - mx, dy = cy - my;
    let dist = Math.hypot(dx, dy);
    const R = keepAway();

    if (dist >= R) { wasNear = false; return; }
    if (!wasNear) { nextMessage(); wasNear = true; }

    if (dist < 0.5) { dx = 1; dy = 0; dist = 1; }
    let nx = mx + (dx / dist) * R - w / 2;
    let ny = my + (dy / dist) * R - h / 2;
    let p = clamp(nx, ny);

    // cornered against an edge: slip around to the other side of the cursor
    if (Math.hypot(p.x + w / 2 - mx, p.y + h / 2 - my) < R) {
      nx = mx < window.innerWidth / 2 ? mx + R - w / 2 + 20 : mx - R - w / 2 - 20;
      ny = my < window.innerHeight / 2 ? my + R * 0.6 - h / 2 : my - R * 0.6 - h / 2;
      p = clamp(nx, ny);
    }
    place(p.x, p.y);
  }

  document.addEventListener("mousemove", (e) => {
    if (card.classList.contains("done")) return;
    repel(e.clientX, e.clientY);
  });

  // phones have no hover: hop a short distance away from the finger
  function hop(e) {
    e.preventDefault();
    const { w, h } = size();
    const r = noBtn.getBoundingClientRect();
    const angle = Math.random() * Math.PI * 2;
    const d = 120 + Math.random() * 60;
    place(r.left + Math.cos(angle) * d, r.top + Math.sin(angle) * d);
    nextMessage();
  }
  noBtn.addEventListener("touchstart", hop, { passive: false });
  noBtn.addEventListener("click", hop); // fallback: it never "works"
  noBtn.addEventListener("focus", () => noBtn.blur());

  window.addEventListener("resize", () => {
    if (pos) place(pos.x, pos.y);
  });

  yesBtn.addEventListener("click", () => {
    card.classList.add("done");
    noBtn.style.display = "none";
    document.getElementById("eyesNormal").style.display = "none";
    document.getElementById("eyesHappy").style.display = "";
    document.getElementById("mouth").setAttribute("d", "M47 68 Q55 78 63 68");
    document.getElementById("overlay").classList.add("show");
    burst();
  });

  document.getElementById("closePopup").addEventListener("click", () => {
    document.getElementById("overlay").classList.remove("show");
  });

  function burst() {
    const items = ["💖", "💕", "💘", "❤️", "💗", "🌸", "✨"];
    for (let i = 0; i < 70; i++) {
      const s = document.createElement("span");
      s.className = "confetti";
      s.textContent = items[Math.floor(Math.random() * items.length)];
      s.style.left = Math.random() * 100 + "vw";
      s.style.fontSize = 14 + Math.random() * 22 + "px";
      s.style.animationDuration = 2.5 + Math.random() * 2.5 + "s";
      s.style.animationDelay = Math.random() * 1.2 + "s";
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 7000);
    }
  }

  // soft floating hearts in the background
  setInterval(() => {
    const h = document.createElement("span");
    h.className = "bg-heart";
    h.textContent = "❤";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 10 + Math.random() * 18 + "px";
    h.style.animationDuration = 6 + Math.random() * 6 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 12000);
  }, 700);
</script>
</body>
</html>
